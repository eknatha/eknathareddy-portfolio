<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>404 — Eknatha Reddy Puli</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0A1013">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%230A1013'/><path d='M9 9h14M9 16h11M9 23h14' stroke='%23C8A56A' stroke-width='2.4' stroke-linecap='round'/></svg>">

<style>
:root{
  --void:#0A1013;--deep:#0E161A;
  --line:#1D2C33;--line-2:#294049;
  --ivory:#EDE8DE;--ivory-2:#C3C7C4;--dim:#7E8F94;
  --brass:#C8A56A;--brass-glow:rgba(200,165,106,.14);
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
  --mono:ui-monospace,"SF Mono","JetBrains Mono","Cascadia Mono",Menlo,Consolas,monospace;
  --pad:clamp(22px,5.5vw,84px);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;min-height:100vh;
  background:var(--void);color:var(--ivory);
  font-family:var(--sans);line-height:1.62;-webkit-font-smoothing:antialiased;
  display:flex;flex-direction:column;justify-content:center;
  position:relative;overflow-x:hidden;
  -webkit-tap-highlight-color:rgba(200,165,106,.18);
}
::selection{background:var(--brass);color:var(--void)}
:focus-visible{outline:2px solid var(--brass);outline-offset:4px;border-radius:2px}

body::before{
  content:"";position:absolute;inset:0;pointer-events:none;
  background-image:
    linear-gradient(to right,rgba(200,165,106,.055) 1px,transparent 1px),
    linear-gradient(to bottom,rgba(200,165,106,.055) 1px,transparent 1px);
  background-size:74px 74px;
  -webkit-mask-image:radial-gradient(112% 80% at 14% 6%,#000 0%,transparent 70%);
  mask-image:radial-gradient(112% 80% at 14% 6%,#000 0%,transparent 70%);
}
body::after{
  content:"";position:absolute;top:-24%;right:-14%;
  width:62vw;height:62vw;max-width:760px;max-height:760px;
  background:radial-gradient(circle,var(--brass-glow) 0%,transparent 62%);
  pointer-events:none;
}

.wrap{position:relative;z-index:1;max-width:1180px;margin:0 auto;padding:64px var(--pad);width:100%}

.status{
  display:inline-flex;align-items:center;gap:12px;margin:0;
  font-family:var(--mono);font-size:10.5px;letter-spacing:.26em;text-transform:uppercase;color:var(--brass);
}
.status::after{content:"";height:1px;width:clamp(48px,14vw,180px);background:linear-gradient(90deg,var(--line-2),transparent)}

h1{
  margin:26px 0 0;font-size:clamp(66px,17vw,190px);font-weight:700;
  letter-spacing:-.055em;line-height:.84;color:var(--ivory);
}
h1 span{color:var(--brass)}

.line{
  margin:30px 0 0;max-width:44ch;
  font-family:var(--serif);font-size:clamp(19px,2.5vw,27px);
  line-height:1.48;letter-spacing:-.012em;color:var(--ivory-2);
}

.path{
  display:inline-block;margin:26px 0 0;padding:10px 14px;max-width:100%;
  background:var(--deep);border:1px solid var(--line);border-radius:2px;
  font-family:var(--mono);font-size:12.5px;color:var(--dim);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.path b{color:var(--brass);font-weight:600}

.cta{display:flex;flex-wrap:wrap;gap:12px;margin-top:44px}
@media (max-width:520px){
  .wrap{padding:44px var(--pad)}
  .btn{padding:14px 20px;font-size:11px;letter-spacing:.13em}
  .path{font-size:11.5px}
}
.btn{
  font-family:var(--mono);font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;
  text-decoration:none;padding:15px 26px;border-radius:2px;
  border:1px solid var(--line-2);color:var(--ivory);
  transition:border-color .22s ease,color .22s ease,background .22s ease,transform .22s ease;
}
.btn:hover{border-color:var(--brass);color:var(--brass);transform:translateY(-2px)}
.btn--solid{background:var(--brass);border-color:var(--brass);color:var(--void);font-weight:600}
.btn--solid:hover{background:#D9B981;border-color:#D9B981;color:var(--void)}
@media (prefers-reduced-motion:reduce){.btn:hover{transform:none}}
</style>
</head>
<body>

<main class="wrap">
  <p class="status">HTTP 404 &middot; Not found</p>
  <h1>4<span>0</span>4</h1>
  <p class="line">This route doesn't resolve. The page was moved, renamed, or never existed here in the first place.</p>
  <p class="path" id="path">Requested: <b>—</b></p>
  <div class="cta">
    <a class="btn btn--solid" href="/">Back to the homepage</a>
    <a class="btn" href="/#contact">Get in touch</a>
  </div>
</main>

<script>
(function () {
  var el = document.getElementById('path');
  if (!el) return;
  var p = (location.pathname + location.search).slice(0, 120) || '/';
  el.textContent = '';
  el.appendChild(document.createTextNode('Requested: '));
  var b = document.createElement('b');
  b.textContent = p;            // textContent, so a crafted URL can't inject markup
  el.appendChild(b);
})();
</script>

</body>
</html>
